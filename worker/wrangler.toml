name = "zgame"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 同源托管 web 前端（apps/web 的 vite build 产物），/api/* 与 /healthz 仍走 Worker。
[assets]
directory = "../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

[observability]
enabled = true

# 复用 zenshare/zcalendar/zkraft 的共享 D1 库 zkraft。
# zgame 的表由 Worker 首次 API 请求自动创建（src/schema.ts 读取 migrations/0001_init.sql，
# 全 IF NOT EXISTS，不碰其它项目的表）。手动兜底：
#   pnpm --filter @zgame/worker db:remote
[[d1_databases]]
binding = "DB"
database_name = "zkraft"
database_id = "8af0a86e-6a55-4e71-ab9e-4e53135a7510"
migrations_dir = "migrations"

[vars]
# 部署后改为真实域名（开放问题 O5）
PUBLIC_ORIGIN = ""
ROOM_TTL_MS = "1800000"
HOST_LOSS_TIMEOUT_MS = "45000"
